services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - siehe .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-pm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pm} -d ${POSTGRES_DB:-pm}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pm}?schema=public
      UPLOAD_DIR: /data/uploads
      APP_ORIGIN: ${APP_ORIGIN:-https://pm.localhost}
      # Next.js prueft bei Server Actions die Origin gegen den Host-Header.
      # Hinter dem Proxy muss die externe Origin durchgereicht werden.
      NODE_ENV: production
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # NIEMALS auf 0.0.0.0 binden - die App hat bewusst keine Authentifizierung.
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
